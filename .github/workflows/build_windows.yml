name: Build Windows Executable
#
# Produces dist/SensDSv2/ zipped, on a real Windows runner. PyInstaller cannot
# cross-compile, so this is the only way to make a Windows build from a Mac.
#
# ── Live radar ────────────────────────────────────────────────────────────────
# The Infineon SDK is not on PyPI and is not freely redistributable, so this
# repository (which is public) must not contain the wheel. The job reads it from
# a repository secret instead, base64-encoded:
#
#     # on a machine holding the Windows wheel:
#     base64 -i ifxradarsdk-3.6.4-py3-none-win_amd64.whl | pbcopy
#     # GitHub -> Settings -> Secrets and variables -> Actions -> New secret
#     #   name: IFXRADARSDK_WHEEL_B64
#
# With the secret set, the build supports live radar. Without it the build still
# works for everything else and says so in the artifact name.
#
# Triggers: push to main, version tags (-> GitHub Release), and manual runs.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create Releases on tags

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # CPU-only torch, installed first so the CUDA build from PyPI never wins.
      # The CUDA build needs NVIDIA driver DLLs that Surface devices do not have.
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # requirements.txt is the single source of truth. An earlier version of
      # this workflow repeated the list by hand and drifted: matplotlib was
      # missing, so the packaged app could not open the reference view.
      - name: Install app dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Infineon Radar SDK (if the wheel secret is set)
        id: radar
        shell: pwsh
        env:
          WHEEL_B64: ${{ secrets.IFXRADARSDK_WHEEL_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WHEEL_B64)) {
            Write-Host "No IFXRADARSDK_WHEEL_B64 secret - building without live radar."
            "radar=false" >> $env:GITHUB_OUTPUT
          } else {
            New-Item -ItemType Directory -Force -Path vendor | Out-Null
            [IO.File]::WriteAllBytes("$PWD\vendor\ifxradarsdk.whl",
              [Convert]::FromBase64String($env:WHEEL_B64))
            pip install vendor\ifxradarsdk.whl
            python -c "import ifxradarsdk; print('ifxradarsdk at', ifxradarsdk.__file__)"
            "radar=true" >> $env:GITHUB_OUTPUT
          }

      # Puts the fine-tuning weights inside the app so the Train tab never needs
      # the network. This is what makes training work on a locked-down laptop.
      - name: Fetch base model for offline training
        run: python tools/fetch_base_model.py

      - name: Build executable
        run: pyinstaller main.spec

      # A build that silently lost a dependency looks identical to a good one
      # until a student clicks the wrong tab, so check the tree before shipping.
      - name: Verify the bundle
        run: python tools/verify_bundle.py dist/SensDSv2

      - name: Name the artifact
        id: naming
        shell: pwsh
        run: |
          $suffix = if ("${{ steps.radar.outputs.radar }}" -eq "true") { "" } else { "-NoRadar" }
          "name=SensDSv2-Windows$suffix" >> $env:GITHUB_OUTPUT

      - name: Zip dist folder
        run: Compress-Archive -Path dist\SensDSv2 -DestinationPath ${{ steps.naming.outputs.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: ${{ steps.naming.outputs.name }}.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.naming.outputs.name }}.zip
          generate_release_notes: true
